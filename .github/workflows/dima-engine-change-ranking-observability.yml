name: dima-engine-change-ranking-observability

on:
  push:
    branches:
      - test/dima9-change-ranking-observability
    paths:
      - "test/metabase/dima/native_material_observation_test.clj"
      - "src/metabase/dima/native_material_observation.clj"
      - ".github/workflows/dima-engine-change-ranking-observability.yml"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 8
      - name: Prove exact frozen base
        shell: bash
        run: |
          set -euo pipefail
          BASE=d5c60dc9f37a9ec9c5b0117f178146bbcb8dca88
          git cat-file -e "$BASE^{commit}" 2>/dev/null || \
            git fetch --no-tags --depth=1 origin "$BASE"
          git cat-file -e "$BASE^{commit}"
          python - <<'PY'
          import subprocess
          base = "d5c60dc9f37a9ec9c5b0117f178146bbcb8dca88"
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", f"{base}..HEAD", "--", "src/**"],
                  text=True,
              ).splitlines()
          )
          expected = {"src/metabase/dima/native_material_observation.clj"}
          assert changed == expected, (changed, expected)
          print("production_source_diff=" + ",".join(sorted(changed)))
          PY
      - name: Prepare backend
        uses: ./.github/actions/prepare-backend
        with:
          java-version: "25"
      - name: Run bounded dima.9 lifecycle and observability regression
        run: >-
          clojure -X:dev:ci:test:oss:oss-dev
          :only '[metabase.metabot.agent.profiles-test
                   metabase.metabot.agent.core-test
                   metabase.metabot.api-test
                   metabase.metabot.tools.construct-representations-test
                   metabase.dima.native-attestation-test
                   metabase.dima.native-material-observation-test
                   metabase.dima.api-test
                   metabase.dima.native-execution-test
                   metabase.dima.execution-api-contract-test]'
      - name: Require bounded Dima namespaces
        run: >-
          clojure -M:dev:oss:oss-dev
          -e "(require 'metabase.metabot.agent.profiles
                       'metabase.metabot.agent.core
                       'metabase.metabot.api
                       'metabase.dima.native-occurrence
                       'metabase.dima.native-material-observation
                       'metabase.dima.native-attestation
                       'metabase.dima.native-execution)"
